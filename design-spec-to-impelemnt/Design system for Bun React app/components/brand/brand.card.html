<!-- @dsCard group="Components" viewport="700x190" name="Brand" subtitle="Wordmark and section headings" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel" data-presets="react" data-plugins="" src="../../_ds_bundle.jsx"></script>
</head>
<body style="margin:0;padding:20px;background:var(--color-background-body);font-family:var(--font-family-body)">
<div id="root"></div>
<script type="text/babel" data-presets="react" data-plugins="">
const NS = Object.values(window).find(v => v && typeof v === 'object' && v.BrandWordmark && v.SectionHeading) || window;
const {BrandWordmark, SectionHeading} = NS;
function Demo() {
  return (
    <div style={{display:'grid', gap:20}}>
      <div style={{display:'flex', alignItems:'center', gap:28, flexWrap:'wrap'}}>
        <BrandWordmark size="lg" />
        <BrandWordmark size="md" />
        <BrandWordmark size="sm" showMark={false} />
        <span style={{background:'var(--brand-teal-800)', padding:'10px 16px', borderRadius:'var(--radius-element)'}}>
          <BrandWordmark size="sm" tone="onDark" />
        </span>
      </div>
      <SectionHeading title="Uitgelichte vacatures" actionLabel="Bekijk alle vacatures" />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
