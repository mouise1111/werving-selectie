<!-- @dsCard group="Colors" viewport="700x160" name="Sollicitatiestatus" subtitle="One colour pair per status in the use cases" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:16px;background:var(--color-background-body);font-family:var(--font-family-body);color:var(--color-text-primary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:grid;gap:6px}
  .chip{width:104px;height:56px;border-radius:var(--radius-inner);border:1px solid var(--color-border)}
  .lbl{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-secondary);line-height:1.35}
  .val{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-disabled)}
  
</style></head><body><div class="row" style="gap:8px">
<span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--radius-full);background:var(--color-status-ontvangen-bg);color:var(--color-status-ontvangen-fg);font-size:12px;font-weight:500"><span style="width:6px;height:6px;border-radius:99px;background:currentColor"></span>Ontvangen</span>
<span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--radius-full);background:var(--color-status-behandeling-bg);color:var(--color-status-behandeling-fg);font-size:12px;font-weight:500"><span style="width:6px;height:6px;border-radius:99px;background:currentColor"></span>In behandeling</span>
<span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--radius-full);background:var(--color-status-test-uitgenodigd-bg);color:var(--color-status-test-uitgenodigd-fg);font-size:12px;font-weight:500"><span style="width:6px;height:6px;border-radius:99px;background:currentColor"></span>Uitgenodigd voor test</span>
<span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--radius-full);background:var(--color-status-test-voltooid-bg);color:var(--color-status-test-voltooid-fg);font-size:12px;font-weight:500"><span style="width:6px;height:6px;border-radius:99px;background:currentColor"></span>Test voltooid</span>
<span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--radius-full);background:var(--color-status-shortlist-bg);color:var(--color-status-shortlist-fg);font-size:12px;font-weight:500"><span style="width:6px;height:6px;border-radius:99px;background:currentColor"></span>Shortlist — interview gepland</span>
<span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--radius-full);background:var(--color-status-aangenomen-bg);color:var(--color-status-aangenomen-fg);font-size:12px;font-weight:500"><span style="width:6px;height:6px;border-radius:99px;background:currentColor"></span>Aangenomen</span>
<span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--radius-full);background:var(--color-status-afgewezen-bg);color:var(--color-status-afgewezen-fg);font-size:12px;font-weight:500"><span style="width:6px;height:6px;border-radius:99px;background:currentColor"></span>Afgewezen</span>
<span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--radius-full);background:var(--color-status-ingetrokken-bg);color:var(--color-status-ingetrokken-fg);font-size:12px;font-weight:500"><span style="width:6px;height:6px;border-radius:99px;background:currentColor"></span>Ingetrokken</span>
<span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--radius-full);background:var(--color-status-geweigerd-bg);color:var(--color-status-geweigerd-fg);font-size:12px;font-weight:500"><span style="width:6px;height:6px;border-radius:99px;background:currentColor"></span>Aanbod geweigerd</span>
<span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--radius-full);background:var(--color-status-wachtstand-bg);color:var(--color-status-wachtstand-fg);font-size:12px;font-weight:500"><span style="width:6px;height:6px;border-radius:99px;background:currentColor"></span>In afwachting van toewijzing</span>
</div></body></html>
