<!-- @dsCard group="Brand" viewport="700x160" name="Actions" subtitle="Lime primary, dark fill, outline, quiet link" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:16px;background:var(--color-background-body);font-family:var(--font-family-body);color:var(--color-text-primary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:grid;gap:6px}
  .chip{width:104px;height:56px;border-radius:var(--radius-inner);border:1px solid var(--color-border)}
  .lbl{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-secondary);line-height:1.35}
  .val{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-disabled)}
  
</style></head><body><div class="row" style="gap:12px;align-items:center">
<button style="height:44px;padding:0 24px;border:0;border-radius:var(--radius-full);background:var(--color-accent);color:var(--color-on-accent);font-family:var(--font-family-body);font-size:14px;font-weight:600">Registreer nu</button>
<button style="height:44px;padding:0 24px;border:0;border-radius:var(--radius-full);background:var(--color-background-inverted);color:var(--color-on-dark);font-family:var(--font-family-body);font-size:14px;font-weight:500">Solliciteer</button>
<button style="height:44px;padding:0 24px;border:1px solid var(--color-border-emphasized);border-radius:var(--radius-full);background:transparent;color:var(--color-text-primary);font-family:var(--font-family-body);font-size:14px;font-weight:500">Solliciteer</button>
<button style="height:44px;padding:0;border:0;background:transparent;color:var(--color-text-secondary);font-family:var(--font-family-body);font-size:14px;font-weight:500">Bekijk alle vacatures</button>
</div>
<div class="val" style="margin-top:10px">One lime action per view. Hover darkens to --brand-lime-600; press adds --color-overlay-pressed. No scale transforms.</div></body></html>
