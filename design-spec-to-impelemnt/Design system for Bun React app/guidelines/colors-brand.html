<!-- @dsCard group="Colors" viewport="700x140" name="Brand core" subtitle="Deep teal ink and the single lime accent" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:16px;background:var(--color-background-body);font-family:var(--font-family-body);color:var(--color-text-primary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:grid;gap:6px}
  .chip{width:104px;height:56px;border-radius:var(--radius-inner);border:1px solid var(--color-border)}
  .lbl{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-secondary);line-height:1.35}
  .val{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-disabled)}
  
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--brand-teal-900);"></div><div class="lbl">--brand-teal-900</div><div class="val">#062A2F</div></div>
<div class="sw"><div class="chip" style="background:var(--brand-teal-800);"></div><div class="lbl">--brand-teal-800</div><div class="val">#0B3B41</div></div>
<div class="sw"><div class="chip" style="background:var(--brand-teal-700);"></div><div class="lbl">--brand-teal-700</div><div class="val">#12545B</div></div>
<div class="sw"><div class="chip" style="background:var(--color-accent);"></div><div class="lbl">--color-accent</div><div class="val">#C7F04A</div></div>
<div class="sw"><div class="chip" style="background:var(--brand-lime-600);"></div><div class="lbl">--brand-lime-600</div><div class="val">#B4E22F</div></div>
<div class="sw"><div class="chip" style="background:var(--color-accent-muted);"></div><div class="lbl">--color-accent-muted</div><div class="val">#EAF6D2</div></div>
</div></body></html>
