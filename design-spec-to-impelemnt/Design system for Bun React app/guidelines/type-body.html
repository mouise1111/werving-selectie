<!-- @dsCard group="Type" viewport="700x190" name="Body, label, supporting" subtitle="Figtree; 14px base, 12px supporting" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:16px;background:var(--color-background-body);font-family:var(--font-family-body);color:var(--color-text-primary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:grid;gap:6px}
  .chip{width:104px;height:56px;border-radius:var(--radius-inner);border:1px solid var(--color-border)}
  .lbl{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-secondary);line-height:1.35}
  .val{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-disabled)}
  
</style></head><body><div style="display:grid;gap:10px;max-width:560px">
<div style="font-size:var(--text-body-size);line-height:var(--text-body-leading)">Body 14px / 1.5 — De recruiter opent het overzicht van sollicitaties, beoordeelt elk cv en stelt op basis daarvan een shortlist samen.</div>
<div style="font-size:var(--font-size-base);font-weight:var(--text-label-weight)">Label 14px / 500 — Motivatiebrief verplicht</div>
<div style="font-size:var(--text-supporting-size);line-height:var(--text-supporting-leading);color:var(--color-text-secondary)">Supporting 12px / 1.67 — Alleen pdf of docx, max. 10 MB.</div>
<div style="font-family:var(--font-family-code);font-size:var(--font-size-base)">Code 14px — status: "testVoltooid"</div>
</div></body></html>
