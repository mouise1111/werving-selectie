<!-- @dsCard group="Colors" viewport="700x140" name="Card tints" subtitle="Rotated across job-card rows, three only" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:16px;background:var(--color-background-body);font-family:var(--font-family-body);color:var(--color-text-primary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:grid;gap:6px}
  .chip{width:104px;height:56px;border-radius:var(--radius-inner);border:1px solid var(--color-border)}
  .lbl{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-secondary);line-height:1.35}
  .val{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-disabled)}
  
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--surface-tint-1);"></div><div class="lbl">surface-tint-1</div><div class="val">#EAF6D2</div></div>
<div class="sw"><div class="chip" style="background:var(--surface-tint-2);"></div><div class="lbl">surface-tint-2</div><div class="val">#EAEAF8</div></div>
<div class="sw"><div class="chip" style="background:var(--surface-tint-3);"></div><div class="lbl">surface-tint-3</div><div class="val">#E3EFF9</div></div>
<div class="sw"><div class="chip" style="background:var(--brand-butter-200);"></div><div class="lbl">brand-butter-200</div><div class="val">#F7E6AE</div></div>
</div></body></html>
