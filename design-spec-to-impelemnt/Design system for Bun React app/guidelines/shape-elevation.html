<!-- @dsCard group="Shape" viewport="700x150" name="Elevation" subtitle="Borders separate; shadow is a whisper" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:16px;background:var(--color-background-body);font-family:var(--font-family-body);color:var(--color-text-primary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:grid;gap:6px}
  .chip{width:104px;height:56px;border-radius:var(--radius-inner);border:1px solid var(--color-border)}
  .lbl{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-secondary);line-height:1.35}
  .val{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-disabled)}
  
</style></head><body><div class="row" style="gap:18px">
<div style="width:150px;height:70px;border-radius:var(--radius-element);background:var(--color-background-card);border:1px solid var(--color-border);box-shadow:var(--shadow-low);display:grid;place-items:center;font-size:12px">shadow-low</div>
<div style="width:150px;height:70px;border-radius:var(--radius-element);background:var(--color-background-card);box-shadow:var(--shadow-med);display:grid;place-items:center;font-size:12px">shadow-med</div>
<div style="width:150px;height:70px;border-radius:var(--radius-element);background:var(--color-background-card);box-shadow:var(--shadow-high);display:grid;place-items:center;font-size:12px">shadow-high</div>
<div style="width:150px;height:70px;border-radius:var(--radius-element);background:var(--color-background-card);box-shadow:var(--shadow-inset-selected);display:grid;place-items:center;font-size:12px">inset-selected</div>
</div></body></html>
