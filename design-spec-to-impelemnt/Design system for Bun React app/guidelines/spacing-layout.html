<!-- @dsCard group="Spacing" viewport="700x180" name="Layout rhythm" subtitle="1180px page, 72px bands, 20px card padding" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:16px;background:var(--color-background-body);font-family:var(--font-family-body);color:var(--color-text-primary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:grid;gap:6px}
  .chip{width:104px;height:56px;border-radius:var(--radius-inner);border:1px solid var(--color-border)}
  .lbl{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-secondary);line-height:1.35}
  .val{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-disabled)}
  
</style></head><body><div style="display:grid;gap:8px">
<div style="border:1px dashed var(--color-border-emphasized);border-radius:var(--radius-element);padding:14px;background:var(--color-background-muted)">
  <div style="display:flex;gap:16px">
    <div style="flex:1;background:var(--color-background-card);border:1px solid var(--color-border);border-radius:var(--radius-element);padding:20px;font-size:12px">card padding 20px</div>
    <div style="flex:1;background:var(--color-background-card);border:1px solid var(--color-border);border-radius:var(--radius-element);padding:20px;font-size:12px">gap 20px</div>
  </div>
</div>
<div class="val">--layout-page-max 1180px · --layout-section-y 72px · --layout-card-gap 20px · --layout-card-padding 20px</div>
</div></body></html>
