<!-- @dsCard group="Shape" viewport="700x150" name="Radius" subtitle="12px cards, 32px bands, everything actionable is a pill" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:16px;background:var(--color-background-body);font-family:var(--font-family-body);color:var(--color-text-primary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:grid;gap:6px}
  .chip{width:104px;height:56px;border-radius:var(--radius-inner);border:1px solid var(--color-border)}
  .lbl{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-secondary);line-height:1.35}
  .val{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-disabled)}
  
</style></head><body><div class="row" style="gap:16px;align-items:center">
<div style="width:96px;height:56px;border:1px solid var(--color-border-emphasized);border-radius:var(--radius-inner)"></div>
<div style="width:96px;height:56px;border:1px solid var(--color-border-emphasized);border-radius:var(--radius-element)"></div>
<div style="width:96px;height:56px;border:1px solid var(--color-border-emphasized);border-radius:var(--radius-container)"></div>
<div style="width:96px;height:56px;border:1px solid var(--color-border-emphasized);border-radius:var(--radius-page)"></div>
<div style="width:120px;height:44px;border-radius:var(--radius-full);background:var(--color-accent);color:var(--color-on-accent);display:grid;place-items:center;font-size:13px;font-weight:600">full</div>
</div>
<div class="val" style="margin-top:8px">inner 8 · element 12 · container 16 · page 32 · full 9999</div></body></html>
