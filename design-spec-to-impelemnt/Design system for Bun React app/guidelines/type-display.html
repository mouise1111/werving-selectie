<!-- @dsCard group="Type" viewport="700x200" name="Display (Poppins)" subtitle="Marketing hero and section titles" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:16px;background:var(--color-background-body);font-family:var(--font-family-body);color:var(--color-text-primary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:grid;gap:6px}
  .chip{width:104px;height:56px;border-radius:var(--radius-inner);border:1px solid var(--color-border)}
  .lbl{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-secondary);line-height:1.35}
  .val{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-disabled)}
  
</style></head><body><div style="display:grid;gap:12px">
<div style="font-family:var(--font-family-heading);font-size:var(--text-hero-size);line-height:var(--text-hero-leading);font-weight:700;letter-spacing:var(--text-hero-tracking)">Vind de job die je verdient</div>
<div class="val">--text-hero-size 56px / 1.08 / 700 / -0.02em</div>
<div style="font-family:var(--font-family-heading);font-size:var(--text-section-size);line-height:var(--text-section-leading);font-weight:700;letter-spacing:var(--text-section-tracking)">Eén platform, veel mogelijkheden</div>
<div class="val">--text-section-size 32px / 1.2 / 700 / -0.015em</div>
</div></body></html>
