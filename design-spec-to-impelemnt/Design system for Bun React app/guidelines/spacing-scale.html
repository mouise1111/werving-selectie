<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:16px;background:var(--color-background-body);font-family:var(--font-family-body);color:var(--color-text-primary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:grid;gap:6px}
  .chip{width:104px;height:56px;border-radius:var(--radius-inner);border:1px solid var(--color-border)}
  .lbl{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-secondary);line-height:1.35}
  .val{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-disabled)}
  
</style></head><body><div class="row" style="align-items:flex-end;gap:14px">
<div style="display:grid;gap:4px;justify-items:center"><div style="width:4px;height:28px;background:var(--brand-lime-500);border-radius:2px"></div><div class="val">1<br>4px</div></div><div style="display:grid;gap:4px;justify-items:center"><div style="width:8px;height:28px;background:var(--brand-lime-500);border-radius:2px"></div><div class="val">2<br>8px</div></div><div style="display:grid;gap:4px;justify-items:center"><div style="width:12px;height:28px;background:var(--brand-lime-500);border-radius:2px"></div><div class="val">3<br>12px</div></div><div style="display:grid;gap:4px;justify-items:center"><div style="width:16px;height:28px;background:var(--brand-lime-500);border-radius:2px"></div><div class="val">4<br>16px</div></div><div style="display:grid;gap:4px;justify-items:center"><div style="width:20px;height:28px;background:var(--brand-lime-500);border-radius:2px"></div><div class="val">5<br>20px</div></div><div style="display:grid;gap:4px;justify-items:center"><div style="width:24px;height:28px;background:var(--brand-lime-500);border-radius:2px"></div><div class="val">6<br>24px</div></div><div style="display:grid;gap:4px;justify-items:center"><div style="width:32px;height:28px;background:var(--brand-lime-500);border-radius:2px"></div><div class="val">8<br>32px</div></div><div style="display:grid;gap:4px;justify-items:center"><div style="width:40px;height:28px;background:var(--brand-lime-500);border-radius:2px"></div><div class="val">10<br>40px</div></div><div style="display:grid;gap:4px;justify-items:center"><div style="width:48px;height:28px;background:var(--brand-lime-500);border-radius:2px"></div><div class="val">12<br>48px</div></div>
</div></body></html>
