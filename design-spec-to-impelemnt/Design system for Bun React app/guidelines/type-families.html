<!-- @dsCard group="Type" viewport="700x150" name="Families" subtitle="Poppins + Figtree (Google Fonts substitutes)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:16px;background:var(--color-background-body);font-family:var(--font-family-body);color:var(--color-text-primary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:grid;gap:6px}
  .chip{width:104px;height:56px;border-radius:var(--radius-inner);border:1px solid var(--color-border)}
  .lbl{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-secondary);line-height:1.35}
  .val{font-size:11px;font-family:var(--font-family-code);color:var(--color-text-disabled)}
  
</style></head><body><div style="display:grid;gap:14px">
<div><div class="val">--font-family-heading · Poppins 600/700</div><div style="font-family:var(--font-family-heading);font-size:22px;font-weight:600">ABCDEFGHIJKLM abcdefghijklm 0123456789</div></div>
<div><div class="val">--font-family-body · Figtree 400/500/600</div><div style="font-family:var(--font-family-body);font-size:18px">ABCDEFGHIJKLM abcdefghijklm 0123456789</div></div>
</div></body></html>
